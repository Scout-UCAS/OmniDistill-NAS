<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">OmniDistill-NAS system overview</title>
  <desc id="desc">A detailed workflow diagram for OmniDistill-NAS, showing inputs, candidate library construction, distillation scoring, constrained search, student building, evidence artifacts, model families, and extension points.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#f6fbf9"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="titleInk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="flowRail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.42" stop-color="#0f766e"/>
      <stop offset="0.72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbe5ef" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto">
      <path d="M2 2.5 L10.5 6.5 L2 10.5 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="10.5" refY="6.5" orient="auto">
      <path d="M2 2.5 L10.5 6.5 L2 10.5 Z" fill="#2563eb"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
      .card-title { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 12.5px; fill: #475569; }
      .small { font-size: 11.5px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #475569; }
      .chip { font-size: 11px; font-weight: 700; }
      .num { font-size: 11px; font-weight: 800; fill: #ffffff; }
      .hair { stroke: #cbd5e1; stroke-width: 1; }
      .connector { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .connector-blue { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>
  <rect x="24" y="24" width="1392" height="712" rx="22" fill="url(#pageBg)" stroke="#d9e2ec"/>
  <rect x="24" y="24" width="1392" height="712" rx="22" fill="url(#grid)" opacity="0.38"/>

  <g class="font">
    <text x="68" y="82" class="title" fill="url(#titleInk)">OmniDistill-NAS</text>
    <text x="68" y="112" class="subtitle">Distillation-guided NAS for efficient LLM, VLM, and VLA inference experiments</text>

    <g transform="translate(1092 58)">
      <rect x="0" y="0" width="264" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>
      <text x="18" y="28" class="section" fill="#0f766e">RUNNABLE AT TWO SCALES</text>
      <circle cx="25" cy="48" r="4" fill="#2563eb"/>
      <text x="38" y="52" class="small">toy backend for CI</text>
      <circle cx="146" cy="48" r="4" fill="#f59e0b"/>
      <text x="159" y="52" class="small">GPU smoke suites</text>
    </g>
  </g>

  <g class="font" transform="translate(68 154)">
    <text x="0" y="0" class="section" fill="#334155">MAIN COMPRESSION PIPELINE</text>
    <rect x="0" y="19" width="1256" height="5" rx="2.5" fill="url(#flowRail)"/>
  </g>

  <g class="font" filter="url(#cardShadow)">
    <g transform="translate(68 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
      <rect width="176" height="7" rx="3.5" fill="#2563eb"/>
      <circle cx="24" cy="34" r="13" fill="#2563eb"/>
      <text x="20" y="38" class="num">1</text>
      <text x="46" y="39" class="card-title">Inputs</text>
      <text x="22" y="70" class="body">teacher checkpoint</text>
      <text x="22" y="92" class="body">token batches</text>
      <text x="22" y="114" class="body">image batches</text>
      <text x="22" y="136" class="body">action traces</text>
      <text x="22" y="158" class="body">experiment specs</text>
      <g transform="translate(22 169)">
        <rect x="0" y="-9" width="38" height="18" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="8" y="4" class="chip" fill="#1d4ed8">JSON</text>
        <rect x="48" y="-9" width="42" height="18" rx="5" fill="#ecfdf5" stroke="#bbf7d0"/>
        <text x="55" y="4" class="chip" fill="#047857">YAML</text>
      </g>
    </g>

    <g transform="translate(284 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#99f6e4"/>
      <rect width="176" height="7" rx="3.5" fill="#0f766e"/>
      <circle cx="24" cy="34" r="13" fill="#0f766e"/>
      <text x="20" y="38" class="num">2</text>
      <text x="46" y="39" class="card-title">Candidate Lab</text>
      <g transform="translate(22 61)">
        <rect x="0" y="0" width="132" height="24" rx="5" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="10" y="16" class="body">attention variants</text>
        <rect x="0" y="34" width="118" height="24" rx="5" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="10" y="50" class="body">FFN substitutes</text>
        <rect x="0" y="68" width="96" height="24" rx="5" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="10" y="84" class="body">layer skips</text>
        <rect x="0" y="102" width="128" height="24" rx="5" fill="#f0fdfa" stroke="#99f6e4"/>
        <text x="10" y="118" class="body">quantized blocks</text>
      </g>
    </g>

    <g transform="translate(500 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
      <rect width="176" height="7" rx="3.5" fill="#059669"/>
      <circle cx="24" cy="34" r="13" fill="#059669"/>
      <text x="20" y="38" class="num">3</text>
      <text x="46" y="39" class="card-title">Scoring Bench</text>
      <text x="22" y="70" class="body">replace-1-layer probes</text>
      <text x="22" y="92" class="body">KL / LM loss / MSE</text>
      <text x="22" y="114" class="body">OPD and action targets</text>
      <text x="22" y="136" class="body">memory and runtime</text>
      <g transform="translate(24 154)">
        <rect x="0" y="0" width="18" height="20" fill="#dcfce7"/>
        <rect x="22" y="0" width="18" height="20" fill="#bbf7d0"/>
        <rect x="44" y="0" width="18" height="20" fill="#86efac"/>
        <rect x="66" y="0" width="18" height="20" fill="#4ade80"/>
        <rect x="88" y="0" width="18" height="20" fill="#22c55e"/>
        <rect x="110" y="0" width="18" height="20" fill="#16a34a"/>
      </g>
    </g>

    <g transform="translate(716 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#fed7aa"/>
      <rect width="176" height="7" rx="3.5" fill="#f59e0b"/>
      <circle cx="24" cy="34" r="13" fill="#f59e0b"/>
      <text x="20" y="38" class="num">4</text>
      <text x="46" y="39" class="card-title">Search</text>
      <text x="22" y="70" class="body">grouped MIP solver</text>
      <text x="22" y="92" class="body">batch memory limits</text>
      <text x="22" y="114" class="body">latency constraints</text>
      <text x="22" y="136" class="body">Pareto sweeps</text>
      <g transform="translate(23 153)">
        <path d="M0 19 H124" stroke="#cbd5e1"/>
        <path d="M0 19 V0" stroke="#cbd5e1"/>
        <circle cx="18" cy="15" r="3.5" fill="#2563eb"/>
        <circle cx="42" cy="11" r="3.5" fill="#0f766e"/>
        <circle cx="66" cy="8" r="3.5" fill="#f59e0b"/>
        <circle cx="94" cy="5" r="3.5" fill="#7c3aed"/>
        <path d="M18 15 C35 10, 51 9, 66 8 S87 6, 94 5" fill="none" stroke="#f59e0b" stroke-width="2"/>
      </g>
    </g>

    <g transform="translate(932 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#fecdd3"/>
      <rect width="176" height="7" rx="3.5" fill="#e11d48"/>
      <circle cx="24" cy="34" r="13" fill="#e11d48"/>
      <text x="20" y="38" class="num">5</text>
      <text x="46" y="39" class="card-title">Student Build</text>
      <text x="22" y="70" class="body">assemble config</text>
      <text x="22" y="92" class="body">GKD refinement</text>
      <text x="22" y="114" class="body">optional OPD</text>
      <text x="22" y="136" class="body">delta checkpoints</text>
      <g transform="translate(24 153)" fill="none" stroke="#e11d48" stroke-width="2">
        <rect x="0" y="0" width="28" height="26" rx="4"/>
        <rect x="38" y="0" width="28" height="26" rx="4"/>
        <rect x="76" y="0" width="28" height="26" rx="4"/>
        <path d="M28 13 H38M66 13H76"/>
      </g>
    </g>

    <g transform="translate(1148 202)">
      <rect width="176" height="188" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
      <rect width="176" height="7" rx="3.5" fill="#7c3aed"/>
      <circle cx="24" cy="34" r="13" fill="#7c3aed"/>
      <text x="20" y="38" class="num">6</text>
      <text x="46" y="39" class="card-title">Evidence</text>
      <text x="22" y="70" class="body">evaluation metrics</text>
      <text x="22" y="92" class="body">profiling reports</text>
      <text x="22" y="114" class="body">export manifests</text>
      <text x="22" y="136" class="body">Markdown reports</text>
      <text x="22" y="158" class="body">result zoo records</text>
    </g>
  </g>

  <g>
    <path d="M244 296 H279" class="connector"/>
    <path d="M460 296 H495" class="connector"/>
    <path d="M676 296 H711" class="connector"/>
    <path d="M892 296 H927" class="connector"/>
    <path d="M1108 296 H1143" class="connector"/>
  </g>

  <g class="font" transform="translate(68 426)">
    <rect x="0" y="0" width="616" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>
    <text x="24" y="34" class="section" fill="#2563eb">STRUCTURED ARTIFACT TRAIL</text>
    <text x="24" y="62" class="body">Every boundary writes files that can be resumed, audited, validated, and compared.</text>
    <g transform="translate(24 86)">
      <rect x="0" y="0" width="160" height="40" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="mono">block_library.pth</text>
      <text x="14" y="31" class="small">candidate weights</text>
      <rect x="196" y="0" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="210" y="17" class="mono">layer_importance</text>
      <text x="210" y="31" class="small">per-layer scores</text>
      <rect x="392" y="0" width="160" height="40" rx="7" fill="#fffbeb" stroke="#fde68a"/>
      <text x="406" y="17" class="mono">topk_configs</text>
      <text x="406" y="31" class="small">selected searches</text>

      <rect x="0" y="56" width="160" height="40" rx="7" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="14" y="73" class="mono">gkd_model.pth</text>
      <text x="14" y="87" class="small">student artifact</text>
      <rect x="196" y="56" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="210" y="73" class="mono">profile.json</text>
      <text x="210" y="87" class="small">latency and memory</text>
      <rect x="392" y="56" width="160" height="40" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="406" y="73" class="mono">report.md</text>
      <text x="406" y="87" class="small">human summary</text>
    </g>
    <path d="M78 190 H538" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="78" cy="190" r="5" fill="#2563eb"/>
    <circle cx="170" cy="190" r="5" fill="#0f766e"/>
    <circle cx="262" cy="190" r="5" fill="#f59e0b"/>
    <circle cx="354" cy="190" r="5" fill="#e11d48"/>
    <circle cx="446" cy="190" r="5" fill="#7c3aed"/>
    <circle cx="538" cy="190" r="5" fill="#64748b"/>
  </g>

  <g class="font" transform="translate(708 426)">
    <rect x="0" y="0" width="616" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#softShadow)"/>
    <text x="24" y="34" class="section" fill="#0f766e">BACKENDS, BENCHMARKS, EXTENSIONS</text>
    <text x="24" y="62" class="body">The same stage contracts run locally, then scale to real model smoke suites.</text>

    <g transform="translate(24 84)">
      <rect x="0" y="0" width="128" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="16" y="24" class="card-title">Toy</text>
      <text x="16" y="42" class="small">CI workflow</text>

      <rect x="146" y="0" width="128" height="54" rx="8" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="162" y="24" class="card-title">Qwen3</text>
      <text x="162" y="42" class="small">text decoder</text>

      <rect x="292" y="0" width="128" height="54" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="308" y="24" class="card-title">Qwen-VL</text>
      <text x="308" y="42" class="small">image + text</text>

      <rect x="438" y="0" width="128" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="454" y="24" class="card-title">OpenVLA</text>
      <text x="454" y="42" class="small">image + action</text>
    </g>

    <g transform="translate(24 158)">
      <rect x="0" y="-12" width="568" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="9" class="small">attention plugins</text>
      <path d="M122 -2 V14" class="hair"/>
      <text x="140" y="9" class="small">dataset adapters</text>
      <path d="M254 -2 V14" class="hair"/>
      <text x="272" y="9" class="small">evaluators</text>
      <path d="M356 -2 V14" class="hair"/>
      <text x="374" y="9" class="small">exporters</text>
      <path d="M452 -2 V14" class="hair"/>
      <text x="470" y="9" class="small">tracking sinks</text>
    </g>
  </g>

  <g>
    <path d="M588 390 C588 407, 244 407, 244 421" class="connector-blue"/>
    <path d="M1236 390 C1236 407, 1016 407, 1016 421" class="connector-blue"/>
  </g>

  <g class="font">
    <rect x="68" y="664" width="1256" height="50" rx="8" fill="#0f172a" opacity="0.94"/>
    <text x="88" y="685" font-size="13" fill="#e2e8f0">One workflow, many artifacts: build candidates, score replacements, solve constrained architectures, and distill students.</text>
    <text x="88" y="704" font-size="13" fill="#cbd5e1">Then evaluate, profile, export, and publish reproducible results that are easy to audit and compare.</text>
  </g>
</svg>
