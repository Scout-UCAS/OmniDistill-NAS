name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Validate public configs
        run: |
          omnidistill validate configs/toy_experiment.json
          omnidistill validate benchmarks/suites/toy_smoke.json --kind benchmark
          omnidistill validate results/toy_smoke/manifest.json --kind result

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
      - name: Lint
        run: python -m ruff check distill_nas_core tools tests
      - name: Type check
        run: python -m mypy distill_nas_core/benchmarks.py distill_nas_core/schema.py distill_nas_core/result_zoo.py distill_nas_core/plugins.py distill_nas_core/tracking.py
      - name: Local workflow check
        run: python tools/check_project.py --workflow

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          mkdocs build --strict
