[project]
name = "omnidistill-nas"
version = "0.1.0"
description = "OmniDistill-NAS: distillation-based architecture search for LLM/VLM/VLA inference experiments."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "OmniDistill-NAS contributors"},
]
keywords = ["neural-architecture-search", "distillation", "llm", "vlm", "vla", "model-compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "pyyaml>=6,<7",
  "scipy>=1.11,<2",
  "torch>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Scout-UCAS/OmniDistill-NAS"
Repository = "https://github.com/Scout-UCAS/OmniDistill-NAS"
Issues = "https://github.com/Scout-UCAS/OmniDistill-NAS/issues"

[project.scripts]
omnidistill = "distill_nas_core.cli:main"
omnidistill-nas = "distill_nas_core.cli:main"

[project.optional-dependencies]
tools = [
  "accelerate>=0.30,<2",
  "datasets==5.0.0",
  "einops>=0.7,<1",
  "huggingface-hub>=0.30.0,<1.0",
  "pillow>=10,<13",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "timm>=0.9.10,<1",
  "transformers>=4.57,<5",
]
dev = [
  "accelerate>=0.30,<2",
  "build>=1,<2",
  "coverage[toml]>=7,<8",
  "datasets==5.0.0",
  "einops>=0.7,<1",
  "huggingface-hub>=0.30.0,<1.0",
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.25,<1",
  "mypy>=1.10,<2",
  "pillow>=10,<13",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "timm>=0.9.10,<1",
  "transformers>=4.57,<5",
  "types-PyYAML>=6.0.12,<7",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.25,<1",
]

[tool.setuptools.packages.find]
include = ["distill_nas_core*", "scripts*", "tools*"]

[tool.setuptools.package-data]
scripts = ["*.sh"]
"distill_nas_core.assets" = [
  "benchmarks/suites/*.json",
  "configs/*.json",
  "results/toy_smoke/*.json",
  "schemas/*.schema.json",
]

[tool.coverage.run]
branch = true
source = ["distill_nas_core"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [
  "vendor",
  "outputs",
  "checkpoints",
  "hf_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
allow_redefinition = true

[[tool.mypy.overrides]]
module = [
  "tests.*",
  "tools.run_qwen3_attention_search",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".cache",
  "checkpoints",
  "hf_cache",
  "outputs",
  "vendor",
]
