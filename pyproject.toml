[project]
name = "omnidistill-nas"
version = "0.1.0"
description = "OmniDistill-NAS: distillation-based architecture search for LLM/VLM/VLA inference experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "scipy",
  "torch",
]

[project.optional-dependencies]
tools = [
  "accelerate",
  "datasets==5.0.0",
  "einops",
  "huggingface-hub>=0.30.0,<1.0",
  "pillow",
  "safetensors",
  "sentencepiece",
  "timm",
  "transformers>=4.57,<5",
]
dev = [
  "accelerate",
  "datasets==5.0.0",
  "einops",
  "huggingface-hub>=0.30.0,<1.0",
  "pillow",
  "pytest",
  "safetensors",
  "sentencepiece",
  "timm",
  "transformers>=4.57,<5",
]

[tool.setuptools.packages.find]
include = ["distill_nas_core*", "scripts*", "tools*"]

[tool.setuptools.package-data]
scripts = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".cache",
  "checkpoints",
  "hf_cache",
  "outputs",
  "vendor",
]
