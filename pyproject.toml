[project]
name = "omnidistill-nas"
version = "0.1.0"
description = "OmniDistill-NAS: distillation-based architecture search for LLM/VLM/VLA inference experiments."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "OmniDistill-NAS contributors"},
]
keywords = ["neural-architecture-search", "distillation", "llm", "vlm", "vla", "model-compression"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "pyyaml>=6,<7",
  "scipy>=1.11,<2",
  "torch>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Scout-UCAS/OmniDistill-NAS"
Repository = "https://github.com/Scout-UCAS/OmniDistill-NAS"
Issues = "https://github.com/Scout-UCAS/OmniDistill-NAS/issues"

[project.scripts]
omnidistill = "distill_nas_core.cli:main"
omnidistill-nas = "distill_nas_core.cli:main"

[project.optional-dependencies]
tools = [
  "accelerate>=0.30,<2",
  "datasets==5.0.0",
  "einops>=0.7,<1",
  "huggingface-hub>=0.30.0,<1.0",
  "pillow>=10,<13",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "timm>=1,<2",
  "transformers>=4.57,<5",
]
dev = [
  "accelerate>=0.30,<2",
  "datasets==5.0.0",
  "einops>=0.7,<1",
  "huggingface-hub>=0.30.0,<1.0",
  "pillow>=10,<13",
  "pytest>=8,<9",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "timm>=1,<2",
  "transformers>=4.57,<5",
]

[tool.setuptools.packages.find]
include = ["distill_nas_core*", "scripts*", "tools*"]

[tool.setuptools.package-data]
scripts = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".cache",
  "checkpoints",
  "hf_cache",
  "outputs",
  "vendor",
]
