<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">OmniDistill-NAS staged workflow</title>
  <desc id="desc">Diagram showing block library, scoring, MIP, Pareto, distillation, and export stages.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <rect x="40" y="60" width="880" height="420" rx="18" fill="#f2f6fb" stroke="#c6d0df"/>
  <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#111827">
    <text x="80" y="118">Candidate Library</text>
    <text x="332" y="118">Distillation Scores</text>
    <text x="604" y="118">MIP Search</text>
    <text x="108" y="348">Pareto Report</text>
    <text x="370" y="348">Global KD</text>
    <text x="624" y="348">Exported Artifact</text>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="76" y="150" width="190" height="110" rx="10"/>
    <rect x="334" y="150" width="190" height="110" rx="10"/>
    <rect x="592" y="150" width="190" height="110" rx="10"/>
    <rect x="76" y="380" width="190" height="70" rx="10"/>
    <rect x="334" y="380" width="190" height="70" rx="10"/>
    <rect x="592" y="380" width="190" height="70" rx="10"/>
  </g>
  <g stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M266 205h68"/>
    <path d="M524 205h68"/>
    <path d="M686 260v74"/>
    <path d="M592 415h-68"/>
    <path d="M334 415h-68"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#384252">
    <text x="104" y="196">attention variants</text>
    <text x="104" y="224">layer skips</text>
    <text x="362" y="196">KL / OPD losses</text>
    <text x="362" y="224">memory runtime</text>
    <text x="626" y="196">constraints</text>
    <text x="626" y="224">top-K configs</text>
    <text x="108" y="424">score-memory-runtime</text>
    <text x="372" y="424">teacher-student refine</text>
    <text x="626" y="424">manifest + report</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#111827"/>
    </marker>
  </defs>
</svg>
